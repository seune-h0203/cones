name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Supabase's publishable/anon key is designed to be public — it ships
          # inside the client bundle regardless, and RLS policies (not key
          # secrecy) are what protect the data. Safe to check in.
          VITE_SUPABASE_URL: https://ljkfoiiefhszjufxjbep.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_CikaQT76tt0suBWaoQvxBg_uIjsJTDv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
