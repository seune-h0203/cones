<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <link rel="icon" type="image/png" href="./images/cones-logo-solid.png" />
    <!-- Kick the background-music fetch off as early as the browser can,
         in parallel with the JS bundle, instead of waiting for React to
         mount/adopt the <audio> below — this document is always the real
         deployed index.html (unlike a deep client route), so a plain
         relative path resolves correctly without needing
         window.__CONES_BASE__. -->
    <link rel="preload" as="audio" href="./audio/theme.mp3" type="audio/mpeg" />

    <title>CONES — TWO ORIGINS, ONE SYSTEM.</title>
    <meta
      name="description"
      content="CONES. TWO ORIGINS, ONE SYSTEM. AI UNIT과 COMPUTER UNIT, 네 명의 아티스트가 하나의 시스템이 된다. DEBUT SHOWCASE 09.15.2026."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CONES" />
    <meta property="og:title" content="CONES — TWO ORIGINS, ONE SYSTEM." />
    <meta
      property="og:description"
      content="PROJECT : CONNECTION : 00 — DEBUT SHOWCASE 09.15.2026"
    />
    <meta property="og:url" content="https://seune-h0203.github.io/cones/" />
    <meta property="og:image" content="https://seune-h0203.github.io/cones/images/og/default.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

  </head>
  <body>
    <script>
      // Restores the original deep-link path saved by public/404.html
      // (GitHub Pages has no server-side rewrite for client routes like
      // /shop/product/x) before React Router mounts. Counterpart of the
      // rafgraph/spa-github-pages redirect in public/404.html.
      //
      // window.__CONES_BASE__ becomes <BrowserRouter basename>, detected
      // at runtime instead of hardcoded so the same build works from a
      // GitHub Pages project subpath, a custom domain root, or a local
      // static server (see vite.config.ts base: "./" / utils/asset.ts).
      (function () {
        var redirect = location.search
          .slice(1)
          .split("&")
          .find(function (part) {
            return part.indexOf("redirect=") === 0;
          });

        if (redirect) {
          // Came through public/404.html — at this exact point (before
          // replaceState) location.pathname IS the deployment root by
          // construction of that redirect, whatever its subpath depth.
          window.__CONES_BASE__ = location.pathname.replace(/\/?$/, "/");
          var decoded = decodeURIComponent(redirect.slice("redirect=".length));
          var parts = decoded.split("~and~");
          var path = parts[0];
          var query = parts[1] ? "?" + parts[1] : "";
          history.replaceState(null, "", window.__CONES_BASE__.slice(0, -1) + path + query);
          // The theme song (below) only auto-starts on the landing route —
          // this is the one place before React mounts where we know the
          // real in-app path being landed on.
          window.__CONES_IS_LANDING__ = path === "/" || path === "";
          return;
        }

        // No redirect param: either a plain visit to the site root, or a
        // deep link served directly by a host with its own SPA fallback
        // (vite dev/preview, Netlify, Vercel, …) — those always root the
        // app at "/". Tell the two apart by checking whether a known
        // in-app route segment shows up in the path; if so, everything
        // before it is the base.
        var knownRoutes = ["shop", "cart", "checkout", "order", "mypage", "login", "signup"];
        var segments = location.pathname.split("/").filter(Boolean);
        var routeIndex = segments.findIndex(function (segment) {
          return knownRoutes.indexOf(segment) !== -1;
        });
        window.__CONES_BASE__ =
          routeIndex === -1
            ? location.pathname.replace(/\/?$/, "/")
            : "/" + segments.slice(0, routeIndex).join("/") + "/";
        window.__CONES_IS_LANDING__ = routeIndex === -1;
      })();
    </script>
    <!-- Lives outside React entirely so playback can be attempted the
         instant this parses — waiting for the JS bundle to fetch, parse
         and mount was the real source of the audible startup lag. React
         (see BackgroundMusic.tsx) only adopts/controls this element by id
         afterwards; it never creates its own <audio>. -->
    <audio id="cones-theme" src="./audio/theme.mp3" loop preload="auto"></audio>
    <script>
      (function () {
        if (!window.__CONES_IS_LANDING__) return;
        var audio = document.getElementById("cones-theme");
        var events = ["pointerdown", "keydown", "touchstart", "wheel"];
        function unlock() {
          audio.play().catch(function () {});
        }
        audio.play().catch(function () {
          events.forEach(function (event) {
            window.addEventListener(event, unlock, { once: true });
          });
        });
      })();
    </script>
    <div id="root"></div>
    <noscript>
      <div style="padding: 40px; color: #f4f4f2; background: #050506; font-family: sans-serif">
        <h1>CONES</h1>
        <p>TWO ORIGINS, ONE SYSTEM. — 이 사이트를 보려면 JavaScript를 활성화해 주세요.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
